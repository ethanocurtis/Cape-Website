services:
  web:
    image: nginx:1.27-alpine
    container_name: cape-tracker-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - notifier

  updater:
    build: ./docker/updater
    container_name: cape-tracker-updater
    restart: unless-stopped
    # Run as your Pi user so files written into the repo stay yours (check with: id -u / id -g)
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      HOME: /tmp
      TZ: ${TZ:-America/Chicago}
      UPDATE_TIME: ${UPDATE_TIME:-05:00}
      GIT_PULL: ${GIT_PULL:-1}
      GIT_BRANCH: ${GIT_BRANCH:-main}
    volumes:
      - ./:/repo
    command: ["python3", "/repo/updater/update.py", "--loop"]

  notifier:
    build: ./docker/notifier
    container_name: cape-tracker-notifier
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Chicago}
      SITE_URL: ${SITE_URL:-https://capes.ecnet.cloud}
    volumes:
      - ./:/repo:ro
      - notifier-data:/data   # webhook subscriptions: secrets, kept out of the repo and site/
    command: ["python3", "/repo/notifier/notifier.py"]

volumes:
  notifier-data:
